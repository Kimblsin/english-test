<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>1500 so’z</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Palitra: Samarqand koshinlari — kobalt, firuza, shafran */
:root{--bg:#eef3f6;--card:#fff;--ink:#0e2438;--mut:#5f7587;--cobalt:#1b3f9b;--teal:#0e9aa7;--saf:#ffc42e;--ok:#1f9d63;--bad:#d6335b;--line:#d7e2e9}
:root[data-theme=dark]{--bg:#0b1823;--card:#122838;--ink:#e6f0f5;--mut:#8fa7b8;--cobalt:#3d63d6;--line:#22404f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;margin:0;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px}
header h1{font-size:22px}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 11px;font-weight:600;font-size:14px}
main{flex:1;overflow-y:auto;padding:10px 18px calc(88px + env(safe-area-inset-bottom))}
.view{display:none}.view.active{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.box h2{font-size:21px;margin-bottom:6px}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .4s}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:10px 0 8px;font:600 12px system-ui;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button span{font-size:22px}
nav button.on{color:var(--cobalt)}
:root[data-theme=dark] nav button.on{color:var(--saf)}
.btn{border:0;border-radius:12px;padding:14px;font:600 16px system-ui;color:#fff;background:var(--cobalt);width:100%}
.btn.ok{background:var(--ok)}.btn.no{background:var(--bad)}
.row{display:flex;gap:10px}
/* Kartochka: old tomoni — koshin naqshli kobalt, bu sahifaning yagona "katta" lahzasi */
.scene{perspective:1000px;height:350px;margin-bottom:14px}
.card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px 28px 10px 28px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.front{color:#fff;background:
 radial-gradient(circle at 50% 50%,transparent 0 22px,rgba(255,255,255,.13) 22px 24px,transparent 24px 46px,rgba(255,255,255,.13) 46px 48px,transparent 48px) 0 0/96px 96px,
 var(--cobalt)}
.front .big{font-size:44px;word-break:break-word;background:var(--cobalt);padding:6px 16px;border-radius:12px}
.front p{margin:16px 0 0;background:var(--cobalt);padding:2px 10px;border-radius:8px;font-size:14px}
.back{background:var(--card);border:2px solid var(--teal);transform:rotateY(180deg)}
.back .big{font-size:32px;color:var(--teal)}
.mn{background:var(--bg);border-left:4px solid var(--saf);border-radius:6px 12px 12px 6px;padding:10px 12px;margin-top:12px;font-size:15px;text-align:left;width:100%}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px;font:600 16px system-ui;margin-bottom:10px}
.opt.good{border-color:var(--ok);background:rgba(31,157,99,.16)}
.opt.bad{border-color:var(--bad);background:rgba(214,51,91,.16)}
.meme img{width:100%;border-radius:10px;display:block}
.meme p{margin:8px 0 0}
.lb div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.lb div:last-child{border:0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <h1>1500 so’z</h1>
  <div class="chips"><div class="chip" id="sc">⭐ 0</div><div class="chip" id="st">🔥 0</div></div>
</header>
<main>
  <section class="view active" id="v-home"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-quiz"></section>
  <section class="view" id="v-memes"></section>
</main>
<nav>
  <button class="on" data-t="home"><span>🏠</span>Bosh</button>
  <button data-t="cards"><span>🃏</span>Kartochka</button>
  <button data-t="quiz"><span>🎮</span>O’yin</button>
  <button data-t="memes"><span>😂</span>Memelar</button>
</nav>
<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
document.documentElement.dataset.theme = tg?.colorScheme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
const initData = tg?.initData || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => "&#" + c.charCodeAt(0) + ";");
const buzz = t => tg?.HapticFeedback?.notificationOccurred(t);
async function api(path, body = {}) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({...body, initData})});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const fail = el => el.innerHTML = '<div class="box">Ulanishda xatolik. Mini App’ni yopib, qayta oching.</div>';
function setStats(u) { $("#sc").textContent = "⭐ " + u.score; $("#st").textContent = "🔥 " + u.streak; }

/* ---- Bosh sahifa ---- */
async function home() {
  const el = $("#v-home");
  try {
    const d = await api("/api/me"); setStats(d);
    const pct = d.total ? Math.round(d.known / d.total * 100) : 0;
    el.innerHTML = `<div class="box"><h2>Salom, ${esc(d.name)}!</h2>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="mut">${d.known} / ${d.total} so’z o’rganildi · reytingda ${d.rank}-o’rin</div></div>
      ${d.task ? `<div class="box"><h2>Bugungi vazifa</h2><div>${esc(d.task)}</div></div>` : ""}
      <div class="box lb"><h2>Eng faol o’quvchilar</h2>${d.top.map((t, i) => `<div><span>${i + 1}. ${esc(t.name)}</span><b>${t.score}</b></div>`).join("")}</div>`;
  } catch { fail(el); }
}

/* ---- Kartochkalar ---- */
let cards = [], ci = 0;
async function loadCards() {
  try { cards = (await api("/api/cards")).cards; ci = 0; showCard(); } catch { fail($("#v-cards")); }
}
function showCard() {
  const el = $("#v-cards");
  if (!cards.length) { el.innerHTML = '<div class="box">Hozircha so’zlar yo’q. Admin so’z qo’shgach, bu yerda ko’rinadi.</div>'; return; }
  if (ci >= cards.length) {
    el.innerHTML = '<div class="box" style="text-align:center"><h2>Kartochkalar tugadi</h2><p class="mut">Yana 20 ta so’z bilan davom eting.</p><button class="btn" onclick="loadCards()">Yana 20 ta</button></div>';
    return;
  }
  const c = cards[ci];
  el.innerHTML = `<div class="mut" style="text-align:center;margin-bottom:8px">${ci + 1} / ${cards.length}</div>
    <div class="scene" onclick="this.firstElementChild.classList.toggle('flip')"><div class="card">
      <div class="face front"><div class="big">${esc(c.english)}</div><p>Tarjima va mnemonika uchun bosing</p></div>
      <div class="face back"><div class="big">${esc(c.uzbek)}</div>
        ${c.mnemonic ? `<div class="mn">💡 ${esc(c.mnemonic)}</div>` : ""}
        ${c.example ? `<div class="mn">📖 ${esc(c.example)}</div>` : ""}</div>
    </div></div>
    <div class="row"><button class="btn no" onclick="mark(false)">Bilmadim</button><button class="btn ok" onclick="mark(true)">Bildim</button></div>`;
}
async function mark(known) {
  buzz(known ? "success" : "warning");
  try { setStats(await api("/api/answer", {word_id: cards[ci].id, known})); } catch {}
  ci++; showCard();
}

/* ---- Test o'yini ---- */
let qs = [], qi = 0, right = 0;
async function loadQuiz() {
  try { qs = (await api("/api/quiz")).questions; qi = 0; right = 0; showQ(); } catch { fail($("#v-quiz")); }
}
function showQ() {
  const el = $("#v-quiz");
  if (!qs.length) { el.innerHTML = '<div class="box">O’yin uchun bazada kamida 4 ta so’z bo’lishi kerak.</div>'; return; }
  if (qi >= qs.length) {
    el.innerHTML = `<div class="box" style="text-align:center"><h2>${right} / ${qs.length} to’g’ri</h2><p class="mut">${right >= qs.length * 0.7 ? "Zo’r natija!" : "Mnemonikalarni qayta o’qib, yana urinib ko’ring."}</p><button class="btn" onclick="loadQuiz()">Qayta o’ynash</button></div>`;
    return;
  }
  const q = qs[qi];
  el.innerHTML = `<div class="bar"><i style="width:${qi / qs.length * 100}%"></i></div>
    <div class="box" style="text-align:center"><div class="mut">Tarjimasini toping</div><div class="big" style="font-size:40px;color:var(--cobalt)">${esc(q.english)}</div></div>
    ${q.options.map(o => `<button class="opt" data-id="${o.id}" onclick="pick(${o.id},this)">${esc(o.text)}</button>`).join("")}
    <div id="fb"></div>`;
}
async function pick(id, btn) {
  document.querySelectorAll(".opt").forEach(b => b.disabled = true);
  try {
    const r = await api("/api/quiz_answer", {word_id: qs[qi].word_id, option_id: id});
    btn.classList.add(r.correct ? "good" : "bad");
    if (!r.correct) document.querySelector(`.opt[data-id="${r.correct_id}"]`)?.classList.add("good");
    if (r.correct) right++;
    buzz(r.correct ? "success" : "error"); setStats(r);
    $("#fb").innerHTML = `${r.mnemonic ? `<div class="mn">💡 ${esc(r.mnemonic)}</div>` : ""}
      <button class="btn" style="margin-top:12px" onclick="qi++;showQ()">Keyingi savol</button>`;
  } catch { fail($("#v-quiz")); }
}

/* ---- Memelar ---- */
async function memes() {
  const el = $("#v-memes");
  try {
    const d = await api("/api/memes");
    el.innerHTML = d.memes.length
      ? d.memes.map(m => `<div class="box meme"><img loading="lazy" src="/media/meme/${m.id}" alt=""><p>${esc(m.caption)}</p></div>`).join("")
      : '<div class="box">Hozircha memelar yo’q.</div>';
  } catch { fail(el); }
}

/* ---- Tablar ---- */
const loaders = {home, cards: loadCards, quiz: loadQuiz, memes};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  const t = b.dataset.t;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "v-" + t));
  loaders[t]();
});
home();
</script>
</body>
</html>
